<?xml version="1.0" encoding="UTF-8"?>
<!--
  Quests tray and menu-bar mark.

  The app icon's Q without its square, in one colour: white on transparent.

  Rules:
  - This is a template image: only the alpha channel carries the drawing.
    macOS recolours it to suit the menu bar, and generate_icon.py writes every
    pixel white, so no colour may ever be added here.
  - The dim track survives as 38% white, because a full ring silhouette reads
    better than a half ring at 22 px.
  - Instead of overlapping the ring, the tail cuts it: the ring is masked by a
    fattened copy of the tail, leaving a transparent sliver either side, so the
    ring visibly passes behind the tail even in a single colour.
  - generate_icon.py only rasterises this file; it never re-derives the
    geometry in code.

  Geometry, on a 1024 grid centred at (512, 512). Angles are measured clockwise
  from 3 o'clock, which is how SVG's y-down coordinates turn.
  - Ring: radius 330, stroke 116, round caps. Track clockwise from 250 deg to
    45 deg; progress counter-clockwise from 272 deg to 45 deg.
  - Tail: radial at 45 deg from r = 230 to r = 470, stroke 124.
  - Cut: the same tail line stroked at 196 (124 plus a 36-unit gap each side).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- White keeps, black removes: the ring is erased wherever the fat tail
         would be. -->
    <mask id="behind" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#FFFFFF"/>
      <path d="M 674.6 674.6 L 844.3 844.3"
            fill="none" stroke="#000000" stroke-width="196" stroke-linecap="round"/>
    </mask>
  </defs>

  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <g mask="url(#behind)">
      <!-- Track: 250 deg clockwise to 45 deg. -->
      <path d="M 399.1 201.9 A 330 330 0 0 1 745.3 745.3"
            stroke-width="116" stroke-opacity="0.38"/>
      <!-- Progress: 272 deg counter-clockwise to 45 deg. -->
      <path d="M 523.5 182.2 A 330 330 0 1 0 745.3 745.3"
            stroke-width="116"/>
    </g>
    <!-- Tail. -->
    <path d="M 674.6 674.6 L 844.3 844.3" stroke-width="124"/>
  </g>
</svg>

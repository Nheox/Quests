name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew :composeApp:desktopTest --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}
          path: composeApp/build/reports/tests/

  package-linux:
    name: Package .deb
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # jpackage shells out to both, and the failure when fakeroot is absent is
      # only visible in build/compose/logs/.
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg

      - name: Build the package
        run: ./gradlew packageDeb --no-daemon

      # jpackage writes its real error to a file under build/compose/logs and
      # prints only the exit code, so a packaging failure is undiagnosable from
      # the CI output alone. Surface it.
      - name: Show jpackage logs
        if: failure()
        run: |
          for f in composeApp/build/compose/logs/*/*.txt; do
            [ -f "$f" ] || continue
            echo "===== $f"
            cat "$f"
          done

      - name: Check the launcher is on PATH in the package
        run: |
          deb=$(ls composeApp/build/compose/binaries/main/deb/*.deb)
          dpkg-deb -c "$deb" | grep -q 'usr/bin/quests -> ' || {
            echo "The .deb is missing /usr/bin/quests, so 'quests --capture' would"
            echo "not resolve and global quick capture would be broken."
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: quests-deb
          path: composeApp/build/compose/binaries/main/deb/*.deb

  package-macos:
    name: Package .dmg
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Unsigned: signing and notarisation need an Apple Developer certificate.
      # See packaging/macos/README.md.
      - name: Build the package
        run: ./gradlew packageDmg --no-daemon

      # jpackage writes its real error to a file under build/compose/logs and
      # prints only the exit code, so a packaging failure is undiagnosable from
      # the CI output alone. Surface it.
      - name: Show jpackage logs
        if: failure()
        run: |
          for f in composeApp/build/compose/logs/*/*.txt; do
            [ -f "$f" ] || continue
            echo "===== $f"
            cat "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: quests-dmg
          path: composeApp/build/compose/binaries/main/dmg/*.dmg
